name: Build Q3000 Firmware (25.12)

on:
  push:
    branches: [25.12]
  workflow_dispatch:

concurrency:
  group: build-q3000
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget curl \
            libtool autoconf automake pkg-config ca-certificates

      - name: 磁盘空间检查
        run: df -h

      - name: 更新并安装 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成配置
        run: |
          cp config.seed .config
          make defconfig
          echo "=== 关键配置确认 ==="
          grep -E 'CONFIG_TARGET_mediatek_filogic_DEVICE_ikuai_q3000|CONFIG_PACKAGE_kmod-mt_wifi' .config

      - name: 编译固件
        run: |
          make -j$(nproc) V=s

      - name: 收集产物
        run: |
          mkdir -p artifacts
          find bin/targets -name '*.bin' -exec cp {} artifacts/ \;
          ls -la artifacts/

      - name: 上传固件产物
        uses: actions/upload-artifact@v4
        with:
          name: q3000-25.12-firmware
          path: artifacts/
          retention-days: 14
